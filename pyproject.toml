[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ads-mcp-server"
version = "0.1.0"
description = "MCP server for Beckhoff TwinCAT PLCs over ADS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "fastmcp>=0.2.0",
  "pyads>=3.4.0"
]

[project.scripts]
ads-mcp = "cli.main:app"

[tool.setuptools]
packages = ["ads", "machine", "catalog", "memory", "mcp_app", "cli"]
